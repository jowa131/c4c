version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: c4c-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # 데이터 파일 영속성: 컨테이너 재생성 시에도 보존
      - analytics_data:/app/appdata
    restart: unless-stopped
    networks:
      default:
        aliases:
          - c4c-backend
          - c4c_backend_service
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: c4c-frontend
    restart: unless-stopped
    networks:
      default:
        aliases:
          - c4c-web
          - c4c_web_service

volumes:
  analytics_data:


networks:
  default:
    name: myproject_default
    external: true
